<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT Clipper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap">
<style>
:root {
  --bg:     #0d0d0f;
  --bg2:    #16161a;
  --bg3:    #1e1e24;
  --border: #2a2a35;
  --fg:     #f0f0f4;
  --fg2:    #9090a8;
  --accent: #7c5cfc;
  --accent2:#5b3fd4;
  --aglow:  rgba(124,92,252,.18);
  --green:  #22d47e;
  --yellow: #f5a623;
  --red:    #ff2255;
  --r:      14px;
  --rs:     8px;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,sans-serif;
     font-size:15px;line-height:1.6;min-height:100vh;
     padding:0 max(16px,env(safe-area-inset-left,0px));
     padding-right:max(16px,env(safe-area-inset-right,0px));}

/* ── Header ── */
header{max-width:820px;margin:0 auto;padding:2rem 0 1.5rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:38px;height:38px;background:var(--accent);border-radius:10px;
      display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo svg{fill:#fff;width:20px;height:20px}
header h1{font-family:'Space Grotesk',sans-serif;font-size:1.45rem;font-weight:700;letter-spacing:-.02em}
header h1 span{color:var(--accent)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:11.5px;background:var(--bg3);border:1px solid var(--border);
       border-radius:6px;padding:4px 10px;color:var(--fg2)}
.badge.low{color:var(--red);border-color:rgba(255,34,85,.35);background:rgba(255,34,85,.08)}

main{max-width:820px;margin:0 auto;padding-bottom:4rem}

/* ── Card ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.25rem}

label.lbl{display:block;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.9rem;margin-bottom:.55rem}

.row{display:flex;gap:10px;flex-wrap:wrap}
input[type=url]{flex:1;min-width:0;background:var(--bg3);border:1.5px solid var(--border);
                border-radius:var(--rs);color:var(--fg);font:inherit;font-size:14px;
                padding:.62rem 1rem;outline:none;transition:border-color .15s,box-shadow .15s}
input[type=url]::placeholder{color:var(--fg2)}
input[type=url]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--aglow)}

.opts{display:flex;gap:12px;flex-wrap:wrap;margin-top:.9rem;align-items:center}
.opts label{font-size:13px;color:var(--fg2)}
select{background:var(--bg3);border:1px solid var(--border);border-radius:6px;
       color:var(--fg);font-size:13px;padding:5px 9px;outline:none;cursor:pointer}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:7px;font-family:'Space Grotesk',sans-serif;
     font-weight:600;font-size:14px;border:none;border-radius:var(--rs);cursor:pointer;
     padding:.65rem 1.3rem;transition:background .15s,transform .1s;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-sm{background:var(--bg3);border:1px solid var(--border);color:var(--fg);
        font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;
        padding:5px 12px;border-radius:6px;gap:5px}
.btn-sm:hover{border-color:var(--accent);background:var(--border)}
.btn-dl{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-dl:hover{background:var(--accent2);border-color:var(--accent2)}

/* ── Status bar ── */
.status{display:none;align-items:flex-start;gap:10px;padding:.75rem 1rem;border-radius:var(--rs);
        font-size:13.5px;margin-bottom:1rem}
.status.show{display:flex}
.status.loading{background:var(--bg3);color:var(--fg2);border:1px solid var(--border)}
.status.error{background:rgba(255,34,85,.08);color:var(--red);border:1px solid rgba(255,34,85,.2)}
.status.ok{background:rgba(34,212,126,.07);color:var(--green);border:1px solid rgba(34,212,126,.2)}
#statusMsg{white-space:pre-wrap;word-break:break-word}

/* ── Progress ── */
.prog-wrap{height:5px;background:var(--bg3);border-radius:99px;overflow:hidden;margin-top:.5rem}
.prog-bar{height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease;width:0%}

.spinner{width:16px;height:16px;margin-top:3px;border:2px solid currentColor;border-top-color:transparent;
         border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── Clips grid ── */
.clips-heading{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;
               margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.cnt-badge{background:var(--accent);color:#fff;border-radius:20px;font-size:11.5px;
           font-weight:600;padding:2px 9px}

.clips-grid{display:grid;gap:10px}

.clip-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
           padding:1.1rem 1.25rem;animation:fadeUp .3s ease both;
           display:grid;gap:.45rem}
.clip-card:hover{border-color:var(--accent)}

.clip-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.clip-num{background:var(--bg3);border:1px solid var(--border);border-radius:5px;
          font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;
          padding:2px 7px;color:var(--fg2);font-variant-numeric:tabular-nums}
.clip-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.93rem}
.clip-time{font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;
           color:var(--accent);background:var(--aglow);padding:2px 9px;border-radius:5px;
           font-variant-numeric:tabular-nums;margin-left:auto}

.clip-bottom{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.clip-dur{font-size:12px;color:var(--fg2)}
.clip-size{font-size:12px;color:var(--fg2)}

/* ── Caption block ── */
.cap{display:grid;gap:6px;margin-top:.35rem;padding-top:.7rem;border-top:1px solid var(--border)}
.cap-head{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;
          font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em}
.cap-field{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:7px;
           color:var(--fg);font:inherit;font-size:13px;padding:7px 10px;resize:vertical}
.cap-field:focus{outline:none;border-color:var(--accent)}
.cap-thumb{width:100%;max-width:320px;border-radius:7px;border:1px solid var(--border)}
.cap-note{font-size:11.5px;color:var(--fg2)}

/* ── Empty ── */
.empty{text-align:center;padding:3rem 1rem;color:var(--fg2)}
.empty svg{width:52px;height:52px;opacity:.2;display:block;margin:0 auto .9rem}
.empty h3{font-family:'Space Grotesk',sans-serif;font-size:1rem;color:var(--fg);margin-bottom:.35rem}
.empty p{font-size:13.5px}

/* ── Toast ── */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
       background:var(--fg);color:var(--bg);border-radius:8px;padding:8px 18px;
       font-size:13.5px;font-weight:500;pointer-events:none;opacity:0;
       transition:opacity .2s;white-space:nowrap;z-index:999}
.toast.show{opacity:1}

@media(max-width:540px){
  .row{flex-direction:column}
  .btn-primary{justify-content:center}
  .clip-time{margin-left:0}
  .hdr-right{margin-left:0;width:100%}
}
</style>
</head>
<body>

<header>
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg></div>
  <h1>YT <span>Clipper</span></h1>
  <div class="hdr-right">
    <span class="badge" id="diskBadge" title="Free space in clips output drive">Checking disk…</span>
    <button class="btn btn-sm" id="cleanBtn" onclick="clearOldClips()" title="Delete saved clip folders to free disk space">
      Clear old clips
    </button>
  </div>
</header>

<main>
  <!-- Input card -->
  <div class="card">
    <label class="lbl" for="urlInput">YouTube URL</label>
    <div class="row">
      <input type="url" id="urlInput"
        placeholder="https://www.youtube.com/watch?v=... or /live/ or /shorts/"
        autocomplete="off" spellcheck="false">
      <button class="btn btn-primary" id="goBtn" onclick="startJob()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
        Generate &amp; Download
      </button>
    </div>
    <div class="opts">
      <label>Clips:
        <select id="clipCount">
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6" selected>6</option>
          <option value="8">8</option>
          <option value="10">10</option>
        </select>
      </label>
      <label>Style:
        <select id="clipStyle">
          <option value="viral">Viral moments</option>
          <option value="insights">Key insights</option>
          <option value="mixed" selected>Mixed</option>
        </select>
      </label>
      <label>Quality:
        <select id="clipQuality">
          <option value="360">360p — fastest ⚡</option>
          <option value="480" selected>480p — balanced ✓</option>
          <option value="720">720p — HD</option>
          <option value="1080">1080p — Full HD</option>
        </select>
      </label>
    </div>

    <div style="margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)">
      <label class="lbl" for="fileInput">Or clip a video file from your computer</label>
      <div class="row">
        <input type="file" id="fileInput" accept="video/*,.mkv,.mov,.mp4,.webm">
        <button class="btn btn-sm" id="upBtn" onclick="startUpload()">Upload &amp; clip</button>
      </div>
    </div>
  </div>

  <!-- Status -->
  <div class="status" id="statusBar">
    <div class="spinner" id="statusSpinner"></div>
    <div style="min-width:0;flex:1">
      <div id="statusMsg">Starting…</div>
      <div class="prog-wrap" id="progWrap" style="display:none;width:220px;margin-top:5px">
        <div class="prog-bar" id="progBar"></div>
      </div>
    </div>
  </div>

  <!-- Clips output -->
  <div id="clipsOut">
    <div class="empty" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="2" y="6" width="20" height="14" rx="3"/>
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        <path d="M10 11l5 2.5-5 2.5V11z"/>
      </svg>
      <h3>No clips yet</h3>
      <p>Paste a YouTube link above, choose how many clips, and hit Generate.</p>
    </div>
    <div id="clipsGrid" class="clips-grid" style="display:none"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
let pollTimer = null;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

async function refreshDisk() {
  const badge = document.getElementById('diskBadge');
  try {
    const r = await fetch('/api/disk');
    const d = await r.json();
    badge.textContent = `${d.free_gb} GB free` + (d.used_mb > 0 ? ` · ${d.used_mb} MB clips` : '');
    badge.title = `Folder: ${d.work_dir}`;
    badge.classList.toggle('low', d.free_gb < 1.0);
  } catch {
    badge.textContent = 'localhost';
  }
}

async function clearOldClips() {
  const btn = document.getElementById('cleanBtn');
  btn.disabled = true;
  try {
    const r = await fetch('/api/cleanup', { method: 'POST' });
    const d = await r.json();
    if (d.removed > 0) {
      toast(`Cleared ${d.removed} folder(s), freed ${d.freed_mb} MB`);
    } else {
      toast('No old clip folders to clear');
    }
    refreshDisk();
  } catch {
    toast('Could not clear clips');
  } finally {
    btn.disabled = false;
  }
}

function setStatus(type, msg, pct) {
  const bar  = document.getElementById('statusBar');
  const msgEl= document.getElementById('statusMsg');
  const prog = document.getElementById('progWrap');
  const pb   = document.getElementById('progBar');
  const sp   = document.getElementById('statusSpinner');

  bar.className = 'status show ' + type;
  msgEl.textContent = msg;

  if (pct !== undefined) {
    prog.style.display = 'block';
    pb.style.width = pct + '%';
  } else {
    prog.style.display = 'none';
  }
  sp.style.display = (type === 'loading') ? 'block' : 'none';
}

function hideStatus() {
  document.getElementById('statusBar').className = 'status';
}

function extractVideoId(url) {
  try {
    const u = new URL(url);
    if (u.hostname.includes('youtu.be')) return u.pathname.slice(1).split('?')[0];
    if (u.hostname.includes('youtube.com')) {
      if (u.pathname.includes('/shorts/')) return u.pathname.split('/shorts/')[1].split('/')[0];
      if (u.pathname.includes('/live/'))   return u.pathname.split('/live/')[1].split('/')[0].split('?')[0];
      if (u.pathname.includes('/embed/'))  return u.pathname.split('/embed/')[1].split('/')[0];
      return u.searchParams.get('v');
    }
  } catch {}
  const m = url.match(/(?:v=|youtu\.be\/|shorts\/|live\/|embed\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

async function startJob() {
  const url     = document.getElementById('urlInput').value.trim();
  const count   = parseInt(document.getElementById('clipCount').value);
  const style   = document.getElementById('clipStyle').value;
  const quality = document.getElementById('clipQuality').value;

  if (!url) { setStatus('error', '⚠️ Paste a YouTube URL first'); return; }
  if (!extractVideoId(url)) { setStatus('error', '⚠️ Not a recognised YouTube URL'); return; }

  document.getElementById('goBtn').disabled = true;
  document.getElementById('emptyState').style.display = 'block';
  document.getElementById('clipsGrid').style.display  = 'none';
  document.getElementById('clipsGrid').innerHTML = '';
  setStatus('loading', 'Starting download…', 0);

  let res, data;
  try {
    res = await fetch('/api/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, count, style, quality })
    });
    data = await res.json();
  } catch(e) {
    setStatus('error', 'Could not reach the server. Is app.py running?');
    document.getElementById('goBtn').disabled = false;
    return;
  }

  if (data.error) {
    setStatus('error', '⚠️ ' + data.error);
    document.getElementById('goBtn').disabled = false;
    return;
  }

  pollJob(data.job_id);
}

async function startUpload() {
  const file  = document.getElementById('fileInput').files[0];
  const count = document.getElementById('clipCount').value;
  const style = document.getElementById('clipStyle').value;
  if (!file) { setStatus('error', '⚠️ Choose a video file first'); return; }

  document.getElementById('upBtn').disabled = true;
  document.getElementById('goBtn').disabled = true;
  document.getElementById('emptyState').style.display = 'block';
  document.getElementById('clipsGrid').style.display  = 'none';
  document.getElementById('clipsGrid').innerHTML = '';
  setStatus('loading', 'Uploading… (large files take a moment)', 0);

  const fd = new FormData();
  fd.append('file', file); fd.append('count', count); fd.append('style', style);
  let data;
  try {
    const res = await fetch('/api/upload', { method: 'POST', body: fd });
    data = await res.json();
  } catch(e) {
    setStatus('error', 'Upload failed. Is app.py running?');
    document.getElementById('upBtn').disabled = false;
    document.getElementById('goBtn').disabled = false;
    return;
  }
  document.getElementById('upBtn').disabled = false;
  if (data.error) {
    setStatus('error', '⚠️ ' + data.error);
    document.getElementById('goBtn').disabled = false;
    refreshDisk();
    return;
  }
  pollJob(data.job_id);
}

function pollJob(jobId) {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    let j;
    try {
      const r = await fetch('/api/status/' + jobId);
      j = await r.json();
    } catch { return; }

    const { status, progress, message, clips } = j;

    if (status === 'downloading' || status === 'analyzing' || status === 'clipping' || status === 'queued') {
      setStatus('loading', message || 'Working…', progress || 0);
    }

    if (status === 'done') {
      clearInterval(pollTimer);
      hideStatus();
      renderClips(clips, jobId);
      document.getElementById('goBtn').disabled = false;
      refreshDisk();
    }

    if (status === 'error') {
      clearInterval(pollTimer);
      setStatus('error', '❌ ' + (message || 'Something went wrong'));
      document.getElementById('goBtn').disabled = false;
      refreshDisk();
    }
  }, 1200);
}

function renderClips(clips, jobId) {
  document.getElementById('emptyState').style.display = 'none';
  const grid = document.getElementById('clipsGrid');
  grid.style.display = 'grid';
  grid.innerHTML = `
    <div class="clips-heading">
      Downloaded Clips
      <span class="cnt-badge">${clips.length}</span>
    </div>
  `;

  clips.forEach((clip, i) => {
    const card = document.createElement('div');
    card.className = 'clip-card';
    card.style.animationDelay = (i * 55) + 'ms';

    const dlUrl = `/api/download/${jobId}/${encodeURIComponent(clip.filename)}`;
    const thumbUrl = clip.thumb_ok ? `/api/download/${jobId}/${encodeURIComponent(clip.thumb_filename)}` : '';

    card.innerHTML = `
      <div class="clip-top">
        <span class="clip-num">CLIP ${String(clip.num).padStart(2,'0')}</span>
        <span class="clip-title">${clip.title}</span>
        <span class="clip-time">${clip.start_fmt} → ${clip.end_fmt}</span>
      </div>
      <div class="clip-bottom">
        <span class="clip-dur">${clip.dur}s</span>
        ${clip.size_mb ? `<span class="clip-size">· ${clip.size_mb} MB</span>` : ''}
        <div style="margin-left:auto;display:flex;gap:7px">
          <a class="btn btn-sm" href="${dlUrl}" target="_blank">▶ Preview</a>
          ${clip.thumb_ok ? `<a class="btn btn-sm" href="${thumbUrl}" download="${clip.thumb_filename}">🖼 Thumbnail</a>` : ''}
          <a class="btn btn-sm btn-dl" href="${dlUrl}" download="${clip.filename}">
            ⬇ Download
          </a>
        </div>
      </div>
      <div class="cap">
        ${clip.thumb_ok ? `<img class="cap-thumb" src="${thumbUrl}" alt="Part ${clip.num} thumbnail">` : ''}
        <div class="cap-head"><span>YouTube title</span>
          <button class="btn btn-sm" data-copy="title">Copy</button></div>
        <input class="cap-field" data-f="title" maxlength="100">
        <div class="cap-head"><span>Description</span>
          <button class="btn btn-sm" data-copy="desc">Copy</button></div>
        <textarea class="cap-field" data-f="desc" rows="7"></textarea>
        ${clip.has_transcript ? '' : '<div class="cap-note">No captions found for this video, so this description is basic.</div>'}
      </div>
    `;
    card.querySelector('[data-f="title"]').value = clip.yt_title || '';
    card.querySelector('[data-f="desc"]').value  = clip.description || '';
    card.querySelectorAll('[data-copy]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const field = card.querySelector(`[data-f="${btn.dataset.copy}"]`);
        try { await navigator.clipboard.writeText(field.value); toast('Copied'); }
        catch { field.select(); document.execCommand('copy'); toast('Copied'); }
      });
    });
    grid.appendChild(card);
  });

  toast(`✅ ${clips.length} clips ready to download!`);
}

document.getElementById('urlInput').addEventListener('paste', e => {
  setTimeout(() => {
    const v = document.getElementById('urlInput').value.trim();
    if (extractVideoId(v)) document.getElementById('urlInput').focus();
  }, 50);
});
document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') startJob();
});

refreshDisk();
</script>
</body>
</html>
